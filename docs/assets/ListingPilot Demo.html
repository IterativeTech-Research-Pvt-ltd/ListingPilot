<style>
/* Layout: app shell — top bar, step rail, one working panel per step; stacks to a single column on phones */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#eaeee9; --ink:#17201d; --muted:#5b6964; --line:#dbe1dc;
  --accent:#0d6b58; --accent-ink:#ffffff; --accent-soft:#dcefe9; --mark:#d98f23; --mark-soft:#fbefdc;
  --good:#2b8048; --good-soft:#e1f2e6; --warn:#a8680f; --warn-soft:#fbefd9; --bad:#b83a2c; --bad-soft:#f9e3e0;
  --wa-bg:#e9e3d9; --wa-in:#ffffff; --wa-out:#d8f5c8; --wa-bar:#0f5c4c;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#171e1b; --sunk:#121816; --ink:#e4ebe7; --muted:#9aa9a3; --line:#29342f;
  --accent:#3db497; --accent-ink:#06120e; --accent-soft:#163a31; --mark:#f0b04f; --mark-soft:#3a2c14;
  --good:#5cc27a; --good-soft:#163222; --warn:#e3a648; --warn-soft:#382a12; --bad:#ef6e5e; --bad-soft:#3d1d19;
  --wa-bg:#0d1714; --wa-in:#1f2a26; --wa-out:#11493b; --wa-bar:#1b3a32; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171e1b; --sunk:#121816; --ink:#e4ebe7; --muted:#9aa9a3; --line:#29342f;
  --accent:#3db497; --accent-ink:#06120e; --accent-soft:#163a31; --mark:#f0b04f; --mark-soft:#3a2c14;
  --good:#5cc27a; --good-soft:#163222; --warn:#e3a648; --warn-soft:#382a12; --bad:#ef6e5e; --bad-soft:#3d1d19;
  --wa-bg:#0d1714; --wa-in:#1f2a26; --wa-out:#11493b; --wa-bar:#1b3a32; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.6rem}
h3{font-size:1.05rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:20px 16px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-size:1.5rem;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:.85rem}
.demo-pill{margin-left:auto;font-size:.8rem;padding:5px 10px;border-radius:999px;background:var(--mark-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--mark) 40%,transparent)}

/* step rail */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:24px}
.steps button{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;margin-bottom:-5px;font-weight:500}
.steps button .n{font-family:var(--f-mono);font-size:.75rem;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.steps button.on{color:var(--ink);border-bottom-color:var(--accent)}
.steps button.on .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button.done .n{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:20px}
.head .lead{max-width:62ch;color:var(--muted);margin-top:6px}
.head .actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:.85rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-good{background:var(--good-soft);color:var(--good)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-idle{background:var(--sunk);color:var(--muted)}
.c-acc{background:var(--accent-soft);color:var(--accent)}

.meter{display:flex;align-items:center;gap:8px;min-width:120px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:block}
.meter i b{display:block;height:100%;background:var(--accent)}

/* AI listings view */
.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}
.skulist{display:flex;flex-direction:column;gap:4px}
.skulist button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid transparent;background:none;color:var(--ink);padding:10px 12px;border-radius:8px}
.skulist button:hover{background:var(--surface)}
.skulist button.on{background:var(--surface);border-color:var(--line)}
.skulist .nm{font-weight:500;font-size:.92rem;line-height:1.3}
.compare{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px}
.card{padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.after{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.cardhead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.score{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.score small{font-size:.8rem;color:var(--muted);font-family:var(--f-body)}
.ltitle{font-weight:600;font-size:1.02rem;line-height:1.4}
.bullets{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.flags{display:flex;flex-direction:column;gap:6px}
.flag{font-size:.85rem;padding:7px 10px;border-radius:6px;background:var(--bad-soft);color:var(--bad)}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{font-family:var(--f-mono);font-size:.8rem;background:var(--sunk);padding:2px 8px;border-radius:4px}
.attrs{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.88rem}
.attrs dt{color:var(--muted)}
.attrs dd{margin:0}
.attrs dd.miss{color:var(--bad);font-weight:500}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.cursor::after{content:"▍";color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.livebox{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted)}
.err{font-size:.85rem;color:var(--bad)}

/* checks */
.issue{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 0;border-top:1px dashed var(--line);font-size:.9rem}
.issue:first-child{border-top:0}
.issue .what{flex:1;min-width:200px}
.issue input,.issue select{font:inherit;font-size:.88rem;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}

.log{font-family:var(--f-mono);font-size:.82rem;background:var(--sunk);border-radius:8px;padding:14px 16px;min-height:120px;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:3px}

/* summary */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.kpi{padding:16px 18px}
.kpi .v{font-family:var(--f-display);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k{color:var(--muted);font-size:.85rem}
.sumgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}

/* phone */
.phone{width:100%;max-width:340px;margin:0 auto;border:8px solid var(--ink);border-radius:30px;overflow:hidden;background:var(--wa-bg);display:flex;flex-direction:column;height:560px}
.phone .bar{background:var(--wa-bar);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.phone .av{width:32px;height:32px;border-radius:50%;background:#2fae8f;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff}
.phone .bar b{font-size:.92rem;display:block}
.phone .bar span{font-size:.72rem;opacity:.8}
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:8px 10px 6px;border-radius:8px;font-size:.84rem;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 0 rgba(0,0,0,.08);color:var(--ink)}
.msg.in{background:var(--wa-in);align-self:flex-start;border-top-left-radius:0}
.msg.out{background:var(--wa-out);align-self:flex-end;border-top-right-radius:0}
.msg .t{display:block;text-align:right;font-size:.66rem;color:var(--muted);margin-top:2px}
.msg img{display:block;border-radius:6px;margin-bottom:6px;max-height:160px;object-fit:cover;width:100%}
.compose{display:flex;gap:6px;padding:8px;background:var(--wa-bg);align-items:flex-end}
.compose textarea{flex:1;resize:none;border:0;border-radius:18px;padding:9px 12px;font:inherit;font-size:.85rem;background:var(--wa-in);color:var(--ink);height:40px}
.iconbtn{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--wa-bar);color:#fff;display:grid;place-items:center;font-size:1rem}
.iconbtn.ghost{background:var(--wa-in);color:var(--muted)}
.tryside{display:flex;flex-direction:column;gap:14px}
.tryside ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}
.chips-row button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:.82rem}

footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 20px}

@media (max-width:860px){
  .split,.compare,.sumgrid{grid-template-columns:minmax(0,1fr)}
  .skulist{flex-direction:row;overflow-x:auto}
  .skulist button{flex:none;width:180px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){.cursor::after{animation:none}}

const S = {tab:"catalogue", sel:"JBP-101", live:false, sample:null, imgs:false, busy:false, chat:[], publishing:false, log:[]};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function missingAttrs(p){ return Object.entries(p.attrs).filter(([,v]) => !String(v).trim()).map(([k]) => k); }
function filledCount(p){ return Object.values(p.attrs).filter(v => String(v).trim()).length; }

function score(p, which){
  const L = which === "after" ? p.gen : p.current;
  if (!L) return null;
  const t = L.title.length;
  const title = t >= 80 && t <= 200 ? 5 : t >= 40 ? 3 : 1;
  const bullets = Math.min(5, L.bullets.filter(b => b.length >= 40).length);
  const total = Object.keys(p.attrs).length;
  const filled = which === "after" ? filledCount(p) : L.filled;
  const attrs = Math.round(5 * filled / total);
  const kw = which === "after" ? Math.min(5, (L.keywords || []).length) : 0;
  const img = p.images >= 6 ? 5 : p.images >= 5 ? 4 : p.images >= 3 ? 2 : 1;
  return {total: title + bullets + attrs + kw + img, parts:{title, bullets, attrs, kw, img, aplus:0}};
}

function issues(p){
  const out = [];
  missingAttrs(p).forEach(k => out.push({lvl:"bad", kind:"attr", key:k, text:`${k} is required for ${p.cat} and is missing from your data`}));
  if (p.images < 3) out.push({lvl:"bad", kind:"img", text:`Only ${p.images} images. Add at least 3 (main image on white plus views)`});
  else if (p.images < 5) out.push({lvl:"warn", kind:"img", text:`${p.images} images. 5 or more are recommended for better conversion`});
  if (p.gen){
    if (p.gen.title.length > 200) out.push({lvl:"bad", text:`Title is ${p.gen.title.length} characters; Amazon allows 200`});
    const banned = /(free delivery|free shipping|best seller|guarantee|cheapest|100% satisfaction)/i;
    [p.gen.title, ...p.gen.bullets, p.gen.desc].forEach(s => { const m = String(s).match(banned); if (m) out.push({lvl:"bad", text:`Contains “${m[0]}”, which Amazon does not allow`}); });
  }
  if (!(p.price > 0)) out.push({lvl:"bad", text:"Price is missing"});
  return out;
}
function state(p){
  if (p.pub === "live") return ["Live on Amazon", "c-good"];
  if (p.pub === "sending") return ["Submitting", "c-acc"];
  if (!p.gen) return ["Not generated", "c-idle"];
  const is = issues(p);
  if (is.some(i => i.lvl === "bad")) return ["Needs fix", "c-bad"];
  if (p.approved) return ["Approved", "c-acc"];
  return ["Ready to review", "c-warn"];
}

async function typeInto(p, d){
  const g = {title:"", bullets:[], desc:"", keywords:[], typing:true};
  p.gen = g;
  const steps = [];
  const words = d.title.split(" ");
  for (let i = 1; i <= words.length; i += 3) steps.push(() => g.title = words.slice(0, i).join(" "));
  steps.push(() => g.title = d.title);
  d.bullets.forEach(b => steps.push(() => g.bullets.push(b)));
  steps.push(() => { g.desc = d.desc; g.keywords = d.keywords.slice(); });
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  for (const s of steps){ s(); if (S.tab === "ai" && S.sel === p.sku) renderAI(); if (!reduce) await new Promise(r => setTimeout(r, 70)); }
  g.typing = false;
}
async function generateAll(){
  S.busy = true;
  for (const p of P){ if (!p.gen){ S.sel = S.tab === "ai" ? p.sku : S.sel; await typeInto(p, p.draft); render(); } }
  S.busy = false; render();
}

const ERR_COPY = {
  not_granted:"Live AI was not allowed in this view. The prepared drafts still work.",
  rate_limited:"Too many requests just now. Try again in a minute.",
  session_expired:"Please sign in to Claude again to use live AI.",
  invalid_json:"The AI reply could not be read. Try again.",
  refused:"The AI declined this request. Try different wording."
};
const errText = e => ERR_COPY[e?.code] || "Live AI is unavailable right now. Try again shortly.";

async function liveRewrite(p){
  if (!S.sample || S.busy) return;
  S.busy = true; renderAI();
  const note = $("#aiNote"); if (note) note.textContent = "AI is writing…";
  const facts = Object.entries(p.attrs).filter(([, v]) => v).map(([k, v]) => `${k}: ${v}`).join("\n");
  const prompt = `You write product listings for Amazon.in. Brand: ${BRAND}. Category: ${p.cat}. Product: ${p.name}. Price: ${rupee(p.price)}.
Facts (use only these; never invent specs, certifications or offers):
${facts}

Reply with only JSON: {"title": string of 120-190 characters starting with "${BRAND}", "bullets": array of exactly 5 strings, each starting with a short CAPS label and a colon, 100-220 characters, "description": string of 40-80 words, "keywords": array of 6 lowercase search phrases Indian shoppers type}.
Do not mention delivery, discounts, "best", guarantees or competitor brands.`;
  try{
    const r = await S.sample.json(prompt, {modelTier:"quick", cache:false});
    if (!r || typeof r.title !== "string" || !Array.isArray(r.bullets)) throw {code:"invalid_json"};
    p.gen = {title:r.title, bullets:r.bullets.slice(0, 5).map(String), desc:String(r.description || ""), keywords:(r.keywords || []).slice(0, 8).map(String), typing:false, liveMade:true};
    p.approved = false;
    S.busy = false; render();
  }catch(e){
    S.busy = false; renderAI();
    if (e?.code === "not_granted" || e?.code === "sampling_disabled"){ S.sample = null; renderAI(); }
    const n = $("#aiNote"); if (n){ n.className = "err"; n.textContent = errText(e); }
  }
}

async function publish(list){
  S.publishing = true;
  const wait = ms => new Promise(r => setTimeout(r, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : ms));
  const ts = () => new Date().toLocaleTimeString("en-IN", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  const add = (h) => { S.log.push(`<div>${h}</div>`); if (S.tab === "publish") renderPublish(); };
  add(`[${ts()}] Batch of ${list.length} listings prepared as JSON listings feed`);
  for (const p of list){
    p.pub = "sending"; add(`[${ts()}] ${p.sku} validating against Amazon's ${esc(p.cat)} schema…`); await wait(450);
    add(`[${ts()}] ${p.sku} submitted`); await wait(350);
    p.pub = "live"; add(`<span class="ok">[${ts()}] ${p.sku} accepted, listing live (demo)</span>`); await wait(200);
  }
  const blocked = P.filter(p => p.gen && issues(p).some(i => i.lvl === "bad"));
  blocked.forEach(p => add(`<span class="no">[${ts()}] ${p.sku} held back: ${esc(issues(p).find(i => i.lvl === "bad").text)}</span>`));
  add(`[${ts()}] Done. ${P.filter(p => p.pub === "live").length} live, ${blocked.length} waiting for a fix.`);
  S.publishing = false; render();
}

    <div class="phone">
      <div class="bar"><div class="av">LP</div><div><b>ListingPilot</b><span>${avail ? "online" : "demo"}</span></div></div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="compose">
        <input type="file" id="pfile" accept="image/jpeg,image/png,image/webp" hidden>
        <button class="iconbtn ghost" id="clip" aria-label="Attach a product photo" ${avail && S.imgs ? "" : "hidden"}>📎</button>
        <textarea id="pnote" placeholder="Describe the product" aria-label="Message"></textarea>
        <button class="iconbtn" id="send" aria-label="Send">➤</button>
      </div>
    </div>
  </div>`;
  renderChat();
  $("#tab-photo").querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { $("#pnote").value = b.dataset.ex; $("#pnote").focus(); });
  const clip = $("#clip"), fi = $("#pfile");
  clip.onclick = () => fi.click();
  fi.onchange = () => { chatFile = fi.files[0] || null; clip.style.background = chatFile ? "var(--accent-soft)" : ""; clip.textContent = chatFile ? "✓" : "📎"; };
  $("#send").onclick = sendChat;
  $("#pnote").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChat(); } };
}
function renderChat(){
  const el = $("#chat"); if (!el) return;
  if (!S.chat.length){
    S.chat = [
      {who:"in", text:"Namaste! Send me a product photo and a short note, and I will draft the Amazon listing."}
    ];
    if (!S.sample){
      S.chat.push({who:"out", text:"Ye cotton ki bedsheet hai, double bed, 2 pillow cover ke saath, price 1299"});
      S.chat.push({who:"in", text:formatDraft({title:"Gulmohar Home 100% Cotton Double Bedsheet with 2 Pillow Covers, Floral Print, Breathable Bedsheet for Double Bed", bullets:["100% COTTON: Soft, breathable cotton for comfortable sleep in every season.","DOUBLE BED SET: Comes with 2 matching pillow covers.","EASY CARE: Machine washable."], keywords:["cotton bedsheet double","bedsheet with 2 pillow covers","floral bedsheet"], missing:["Bedsheet size in inches","Thread count","Colour","Care instructions"]})});
    }
  }
  el.innerHTML = S.chat.map(m => `<div class="msg ${m.who}">${m.img ? `<img src="${m.img}" alt="Product photo sent">` : ""}${esc(m.text)}<span class="t">${m.t || "now"}</span></div>`).join("");
  el.scrollTop = el.scrollHeight;
}
function formatDraft(r){
  let s = "Draft listing ready\n\nTITLE\n" + r.title + "\n\nBULLETS\n" + (r.bullets || []).map(b => "• " + b).join("\n");
  if (r.keywords?.length) s += "\n\nKEYWORDS\n" + r.keywords.join(", ");
  if (r.missing?.length) s += "\n\nNEEDED BEFORE PUBLISHING\n" + r.missing.map(m => "• " + m).join("\n");
  return s;
}
async function sendChat(){
  const note = $("#pnote").value.trim();
  if (!note && !chatFile) return;
  if (!S.sample){ S.chat.push({who:"out", text:note}); S.chat.push({who:"in", text:"Live AI runs when this page is opened in Claude. Ask your IterativeTech contact for a live run."}); $("#pnote").value = ""; renderChat(); return; }
  const img = chatFile ? URL.createObjectURL(chatFile) : null;
  const file = chatFile;
  S.chat.push({who:"out", text:note || "(photo)", img});
  const typing = {who:"in", text:"Writing your listing…"}; S.chat.push(typing);
  $("#pnote").value = ""; chatFile = null; renderPhoto();
  const prompt = `A seller's staff member sent this product on WhatsApp${file ? " with the attached photo" : ""}. Their note (may be Hindi, Hinglish or English): "${note || "no note"}".
Write an Amazon.in listing draft in English for the brand "${BRAND}". Use only what is stated in the note or clearly visible in the photo; never invent sizes, materials, certifications or offers.
Reply with only JSON: {"title": string of 100-180 characters starting with "${BRAND}", "bullets": array of 4 strings each starting with a short CAPS label and a colon, "keywords": array of 5 lowercase search phrases, "missing": array of short names of facts Amazon will need that were not given}.`;
  chatCtl = new AbortController();
  try{
    const opts = {modelTier:"quick", cache:false, signal:chatCtl.signal};
    if (file && S.imgs) opts.images = file;
    const r = await S.sample.json(prompt, opts);
    if (!r || typeof r.title !== "string") throw {code:"invalid_json"};
    typing.text = formatDraft(r);
  }catch(e){
    typing.text = errText(e);
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") S.sample = null;
  }
  renderChat();
}

function render(){
  renderSteps();
  if (S.tab === "catalogue") renderCatalogue();
  if (S.tab === "ai") renderAI();
  if (S.tab === "check") renderCheck();
  if (S.tab === "publish") renderPublish();
  if (S.tab === "summary") renderSummary();
  if (S.tab === "photo") renderPhoto();
}
render();

(async () => {
  try{
    const s = window.claude ? await window.claude.use("sample") : null;
    if (s){
      S.sample = s;
      const lim = await s.limits().catch(() => null);
      S.imgs = !!lim?.images;
      if (S.tab === "ai" || S.tab === "photo") render();
    }
  }catch(e){}
})();
</script>
